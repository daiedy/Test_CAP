# This is the resource bundle for products

#XTIT: Application name
appTitle=Product Catalog

#YDES: Application description
appDescription=Product Catalog Application

#XTIT: Title of the Details custom section on the product Object Page (manifest)
ProductsObjectPage.details.title=Details

#XFLD: Counter of filled detail fields; {0} filled fields, {1} all fields of the subcategory
ProductsObjectPage.details.filled=Filled {0} of {1}

#XMSG: Details section in display mode when the product has no subcategory
ProductsObjectPage.details.noSubcategory=No subcategory selected.

#XMSG: Details section in edit mode when the product has no subcategory
ProductsObjectPage.details.selectSubcategory=Select a subcategory to fill in the details.

#XMSG: Details section when the subcategory has no assigned attributes
ProductsObjectPage.details.noAttributes=No details available.

#XMSG: Value state text of a list field whose typed text matches no item
ProductsObjectPage.details.valueNotInList=Select a value from the list.

#XFLD: Placeholder of an empty numeric detail; {0} lower and {1} upper bound, formatted by the row's Decimal type; en dash U+2013
ProductsObjectPage.details.range={0}–{1}

#XFLD: Placeholder of an empty numeric detail when only a lower bound exists; {0} the bound
ProductsObjectPage.details.rangeFrom=from {0}

#XFLD: Placeholder of an empty numeric detail when only an upper bound exists; {0} the bound
ProductsObjectPage.details.rangeUpTo=up to {0}

#XFLD: Placeholder of a disabled dependent detail; {0} the localized name of the attribute whose values enable it
ProductsObjectPage.details.dependsOn=Depends on {0}

#XMSG: Toast when a dependent detail's value is cleared because its last enabling value was deselected; {0} the detail's name, {1} the enabling attribute's name
ProductsObjectPage.details.cleared={0} cleared: it depends on {1}.
