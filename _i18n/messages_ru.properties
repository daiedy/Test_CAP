# Import of products from an xlsx workbook (ADR-0021). {0} row numbers count the header row as 1.
#XMSG: Success of the import, {0} number of created products
PRODUCTS_IMPORT_DONE=Импортировано товаров: {0}.
#XMSG: First message of every rejected import, nothing was written
PRODUCTS_IMPORT_NOTHING_IMPORTED=Товары не импортированы. Исправьте указанные ниже строки и снова импортируйте файл.
#XMSG: Row error, {0} sheet row, {1} workbook column name, {2} localized reason of the framework check
PRODUCTS_IMPORT_ROW_INVALID=Строка {0}, столбец "{1}": {2}
#XMSG: Row error, {0} sheet row, {1} product name that already exists
PRODUCTS_IMPORT_DUPLICATE_NAME=Строка {0}, столбец "name": товар с названием "{1}" уже есть в каталоге или выше в файле.
#XMSG: The uploaded file is not an xlsx workbook
PRODUCTS_IMPORT_NOT_XLSX=Файл не является книгой Excel. Выберите файл .xlsx.
#XMSG: The workbook has no data rows below the header row
PRODUCTS_IMPORT_EMPTY=В файле нет строк с товарами. Добавьте строки под строкой заголовков.
#XMSG: Header error, {0} header text of the unsupported column
PRODUCTS_IMPORT_UNKNOWN_COLUMN=Столбец "{0}" не поддерживается. Допустимые столбцы: name, description, price, currency, stock, category, rating, imageUrl.
#XMSG: Header error, {0} name of the documented column that appears more than once
PRODUCTS_IMPORT_DUPLICATE_COLUMN=В строке заголовков столбец "{0}" указан более одного раза.
#XMSG: Header error, {0} name of the missing mandatory column
PRODUCTS_IMPORT_MISSING_COLUMN=В строке заголовков нет столбца "{0}".
#XMSG: Row limit exceeded, {0} data rows in the file, {1} maximum rows per import
PRODUCTS_IMPORT_TOO_MANY_ROWS=В файле строк: {0}; за один раз можно импортировать не более {1}. Разделите файл.
