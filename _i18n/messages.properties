# Error messages for req.reject(code, 'KEY', [args]). Keys UPPER_SNAKE, prefixed with entity.
# Import of products from an xlsx workbook (ADR-0021). {0} row numbers count the header row as 1.
PRODUCTS_IMPORT_DONE=Products imported: {0}.
PRODUCTS_IMPORT_NOTHING_IMPORTED=No products were imported. Correct the rows listed below and import the file again.
PRODUCTS_IMPORT_ROW_INVALID=Row {0}, column "{1}": {2}
PRODUCTS_IMPORT_DUPLICATE_NAME=Row {0}, column "name": a product named "{1}" already exists in the catalog or earlier in the file.
PRODUCTS_IMPORT_NOT_XLSX=The file is not an Excel workbook. Choose an .xlsx file.
PRODUCTS_IMPORT_EMPTY=The file contains no product rows. Add rows below the header row.
PRODUCTS_IMPORT_UNKNOWN_COLUMN=Column "{0}" is not supported. Allowed columns: name, description, price, currency, stock, category, rating, imageUrl.
PRODUCTS_IMPORT_MISSING_COLUMN=The header row has no column "{0}".
PRODUCTS_IMPORT_TOO_MANY_ROWS=The file has {0} product rows; at most {1} can be imported at once. Split the file.
