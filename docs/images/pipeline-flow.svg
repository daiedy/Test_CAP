<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1220 840" role="img" aria-label="Flow diagram of a task through the pipeline: eight phases in rows; the lead agent on the left, worker agents and what they deliver in the middle, further right what is checked before the next phase, in the right column the automatic checks and the moment they fire; a dashed loop returns defects and blocking findings to phases 2 and 3" xmlns="http://www.w3.org/2000/svg">
<style>
  svg {
    --bg:#f4f7f8; --surface:#ffffff; --ink:#1c252b; --muted:#5e6a73; --line:#d8dfe4;
    --accent:#0e7f84; --accent-soft:#d9eff0; --warn:#b26f16; --warn-soft:#f9ead2;
    --hook:#6d4ec4; --hook-soft:#e9e4f9; --dash:#8a97a2; --code-bg:#e9eef1;
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg:#121a1f; --surface:#1a232a; --ink:#e4eaee; --muted:#9cabb5; --line:#2e3b44;
      --accent:#4dc4c2; --accent-soft:#163a3b; --warn:#e3aa55; --warn-soft:#3a2c12;
      --hook:#b39cf3; --hook-soft:#2c2546; --dash:#6f7f8b; --code-bg:#222d36;
    }
  }
</style>
<rect x="0" y="0" width="1220" height="840" style="fill:var(--bg)"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker>
</defs>
<g font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">
  <text x="130" y="30">Lead agent (the /feature skill)</text>
  <text x="470" y="30">Worker agents and what they deliver</text>
  <text x="810" y="30">What is checked before the next phase</text>
  <text x="1087" y="30">Automatic checks (hooks)</text>
</g>

<g stroke="currentColor" stroke-width="1" style="fill:var(--surface)">
  <rect x="20" y="56" width="220" height="68" rx="6"/><rect x="20" y="148" width="220" height="68" rx="6"/><rect x="20" y="240" width="220" height="68" rx="6"/><rect x="20" y="332" width="220" height="68" rx="6"/><rect x="20" y="424" width="220" height="68" rx="6"/><rect x="20" y="516" width="220" height="68" rx="6"/><rect x="20" y="608" width="220" height="68" rx="6"/><rect x="20" y="700" width="220" height="68" rx="6"/>
</g>
<g font-size="12.5" font-weight="600" fill="currentColor">
  <text x="32" y="78">Phase 0 · Preparation</text><text x="32" y="170">Phase 1 · Plan</text><text x="32" y="262">Phase 2 · Backend</text><text x="32" y="354">Phase 3 · Screens</text><text x="32" y="446">Phase 4 · Browser check</text><text x="32" y="538">Phase 5 · Review</text><text x="32" y="630">Phase 6 · Documentation</text><text x="32" y="722">Phase 7 · Wrap-up</text>
</g>
<g font-size="10.5" style="fill:var(--muted)">
  <text x="32" y="96">asks feature name and</text><text x="32" y="111">checkpoint mode; branch, folder</text>
  <text x="32" y="188">without an approved</text><text x="32" y="203">plan, no code</text>
  <text x="32" y="280">model, service, texts,</text><text x="32" y="295">data; commit</text>
  <text x="32" y="372">if the plan has screens;</text><text x="32" y="387">commit</text>
  <text x="32" y="464">if a worker runs out of turns,</text><text x="32" y="479">it resumes where it stopped</text>
  <text x="32" y="556">findings go to the author;</text><text x="32" y="571">lead checks, does not fix</text>
  <text x="32" y="648">never skipped;</text><text x="32" y="663">commit</text>
  <text x="32" y="740">after each phase the lead</text><text x="32" y="755">updates the state file</text>
</g>

<g stroke="currentColor" stroke-width="1" style="fill:var(--surface)">
  <rect x="270" y="56" width="400" height="68" rx="6" stroke-dasharray="4 3" style="fill:none;stroke:var(--dash)"/>
  <rect x="270" y="148" width="190" height="68" rx="6"/><rect x="480" y="148" width="190" height="68" rx="6"/>
  <rect x="270" y="240" width="190" height="68" rx="6"/><rect x="480" y="240" width="190" height="68" rx="6"/>
  <rect x="270" y="332" width="190" height="68" rx="6"/><rect x="480" y="332" width="190" height="68" rx="6"/>
  <rect x="270" y="424" width="400" height="68" rx="6"/><rect x="270" y="516" width="400" height="68" rx="6"/><rect x="270" y="608" width="400" height="68" rx="6"/>
  <rect x="270" y="700" width="400" height="68" rx="6" stroke-dasharray="4 3" style="fill:none;stroke:var(--dash)"/>
</g>
<g font-size="10.5" style="fill:var(--muted)">
  <text x="282" y="78">input: backlog issue (/backlog), feature name from its title;</text><text x="282" y="93">lead confirms name and mode with the human, creates branch</text><text x="282" y="108">and feature folder, labels issue in-progress</text>
  <text x="282" y="734">closes issue with summary, prunes folder to SUMMARY.md;</text><text x="282" y="749">report to human: commits, acceptance criteria, debt; push</text><text x="282" y="764">to shared repository only if human says so</text>
</g>
<g font-size="12" font-weight="500" font-family="IBM Plex Mono, ui-monospace, monospace" fill="currentColor">
  <text x="282" y="168">architect</text><text x="492" y="168">ux-designer</text>
  <text x="282" y="260">cap-backend-dev</text><text x="492" y="260">test-backend</text>
  <text x="282" y="352">fiori-app-dev</text><text x="492" y="352">test-ui</text>
  <text x="282" y="444">ui-verifier</text><text x="282" y="536">reviewer</text><text x="282" y="628">docs-keeper</text>
</g>
<g font-size="10.5" style="fill:var(--muted)">
  <text x="282" y="183">architect</text><text x="282" y="198">CONTEXT.md (brief), PLAN.md</text><text x="282" y="211">and research/*.md; no code</text>
  <text x="492" y="183">screen designer</text><text x="492" y="198">SCREENS.md, if there</text><text x="492" y="211">is a UI</text>
  <text x="282" y="275">backend developer</text><text x="282" y="290">data model, service, texts,</text><text x="282" y="303">test data</text>
  <text x="492" y="275">backend tester</text><text x="492" y="290">service autotests and the</text><text x="492" y="303">OData snapshot</text>
  <text x="282" y="367">Fiori screen developer</text><text x="282" y="382">annotations, pages, texts</text><text x="282" y="395">(or ui5-freestyle-dev per plan)</text>
  <text x="492" y="367">UI tester</text><text x="492" y="382">UI autotests:</text><text x="492" y="395">QUnit, OPA5</text>
  <text x="365" y="444">browser verifier</text><text x="282" y="462">walks the plan's scenarios in a real browser, takes screenshots,</text><text x="282" y="477">gathers errors; writes VERIFICATION.md as it goes, not after</text>
  <text x="345" y="536">reviewer</text><text x="282" y="554">checks changes against plan, conventions and registry of existing</text><text x="282" y="569">code; finds duplicates; writes REVIEW.md; fixes nothing</text>
  <text x="370" y="628">documentation keeper</text><text x="282" y="646">registry of existing code, changelog, state file, feature</text><text x="282" y="661">summary, lessons</text>
</g>

<g stroke-width="1.5" style="fill:var(--accent-soft);stroke:var(--accent)">
  <rect x="700" y="56" width="220" height="68" rx="6"/><rect x="700" y="148" width="220" height="68" rx="6"/><rect x="700" y="240" width="220" height="68" rx="6"/><rect x="700" y="332" width="220" height="68" rx="6"/><rect x="700" y="424" width="220" height="68" rx="6"/><rect x="700" y="516" width="220" height="68" rx="6"/><rect x="700" y="608" width="220" height="68" rx="6"/><rect x="700" y="700" width="220" height="68" rx="6"/>
</g>
<g font-size="11" font-weight="600" fill="currentColor">
  <text x="712" y="74">Human confirmed name and mode</text><text x="712" y="166">Human wrote "approved"</text><text x="712" y="258">npm run lint and npm test green</text><text x="712" y="350">ui5lint error-free, npm test</text><text x="712" y="442">Verdict "ready for review"</text><text x="712" y="534">Zero blocking findings</text><text x="712" y="626">check-docs-fresh.mjs green</text><text x="712" y="718">Human decides on the push</text>
</g>
<g font-size="10.5" style="fill:var(--muted)">
  <text x="712" y="90">the mode is chosen once:</text><text x="712" y="105">semi-autonomous, autonomous</text><text x="712" y="120">or manual</text>
  <text x="712" y="182">check-feature-docs.mjs first;</text><text x="712" y="197">"a new decision is needed" stops</text><text x="712" y="212">the pipeline, the human is asked</text>
  <text x="712" y="274">command output is in</text><text x="712" y="289">the worker reports</text>
  <text x="712" y="366">OData snapshot updated</text><text x="712" y="381">on purpose</text>
  <text x="712" y="458">defects → phase 2 or 3,</text><text x="712" y="473">at most two rounds,</text><text x="712" y="488">then ask the human</text>
  <text x="712" y="550">re-review covers only</text><text x="712" y="565">the fixes</text>
  <text x="712" y="642">registry, STATE, CHANGELOG,</text><text x="712" y="657">feature summary</text>
  <text x="712" y="734">shared repository and pull request</text><text x="712" y="749">only if human says so</text>
</g>

<g stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#ar)">
  <line x1="240" y1="90" x2="270" y2="90"/><line x1="670" y1="90" x2="700" y2="90"/>
  <line x1="240" y1="182" x2="270" y2="182"/><line x1="460" y1="182" x2="480" y2="182"/><line x1="670" y1="182" x2="700" y2="182"/>
  <line x1="240" y1="274" x2="270" y2="274"/><line x1="460" y1="274" x2="480" y2="274"/><line x1="670" y1="274" x2="700" y2="274"/>
  <line x1="240" y1="366" x2="270" y2="366"/><line x1="460" y1="366" x2="480" y2="366"/><line x1="670" y1="366" x2="700" y2="366"/>
  <line x1="240" y1="458" x2="270" y2="458"/><line x1="670" y1="458" x2="700" y2="458"/>
  <line x1="240" y1="550" x2="270" y2="550"/><line x1="670" y1="550" x2="700" y2="550"/>
  <line x1="240" y1="642" x2="270" y2="642"/><line x1="670" y1="642" x2="700" y2="642"/>
  <line x1="240" y1="734" x2="270" y2="734"/><line x1="670" y1="734" x2="700" y2="734"/>
  <path d="M810,124 V136 H130 V148"/><path d="M810,216 V228 H130 V240"/><path d="M810,308 V320 H130 V332"/><path d="M810,400 V412 H130 V424"/><path d="M810,492 V504 H130 V516"/><path d="M810,584 V596 H130 V608"/><path d="M810,676 V688 H130 V700"/>
</g>
<g stroke-width="1.5" fill="none" stroke-dasharray="5 4" style="stroke:var(--warn)">
  <path d="M920,458 H945 V274"/><path d="M920,550 H945"/>
  <line x1="945" y1="274" x2="922" y2="274" marker-end="url(#arw)"/><line x1="945" y1="366" x2="922" y2="366" marker-end="url(#arw)"/>
</g>
<text transform="rotate(-90 960 412)" x="960" y="412" font-size="10" text-anchor="middle" style="fill:var(--warn)">back for rework: defects from phase 4 and blocking findings from phase 5 go to phase 2 or 3</text>

<g stroke-width="1.5" style="fill:var(--hook-soft);stroke:var(--hook)">
  <rect x="975" y="56" width="225" height="68" rx="6"/>
  <rect x="975" y="148" width="225" height="528" rx="6" stroke-dasharray="4 3" style="fill:none;stroke:var(--hook)"/>
  <rect x="985" y="178" width="205" height="118" rx="6"/><rect x="985" y="312" width="205" height="150" rx="6"/><rect x="985" y="478" width="205" height="186" rx="6"/>
  <rect x="975" y="700" width="225" height="68" rx="6"/>
  <rect x="20" y="792" width="1180" height="40" rx="6" stroke-dasharray="4 3" style="fill:none;stroke:var(--hook)"/>
</g>
<g font-size="11.5" font-weight="600" fill="currentColor">
  <text x="987" y="72">Session start</text>
  <text x="1087" y="166" text-anchor="middle" style="fill:var(--hook)">Inside every worker</text>
  <text x="997" y="194">Before a file edit</text><text x="997" y="328">After a file edit</text><text x="997" y="410">On a reference call</text><text x="997" y="494">When a worker finishes</text>
  <text x="987" y="716">Final gate</text>
</g>
<g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" style="fill:var(--hook)">
  <text x="987" y="87">SessionStart · session-start.mjs</text>
  <text x="997" y="209">PreToolUse · protect-files*.mjs</text>
  <text x="997" y="343">PostToolUse · post-edit.mjs</text>
  <text x="997" y="425">PostToolUse · mcp-audit.mjs</text>
  <text x="997" y="509">SubagentStop · subagent-stop.mjs</text>
  <text x="987" y="731">Stop · stop-gate.mjs</text>
</g>
<g font-size="10.5" style="fill:var(--muted)">
  <text x="987" y="103">briefing: queue, what to do;</text><text x="987" y="117">STATE.md (Now, Open debt), Node, cds</text>
  <text x="997" y="225">forbids edits to protected</text><text x="997" y="239">files (pipeline settings,</text><text x="997" y="253">manifest, registry, deploy);</text><text x="997" y="267">in terminal: worker denied,</text><text x="997" y="281">human asked (PROTECTED)</text>
  <text x="997" y="359">cds compile, eslint, ui5lint,</text><text x="997" y="373">i18n pairs, STATE/PLAN shape;</text><text x="997" y="387">edit entry in .pipeline/*.jsonl</text>
  <text x="997" y="440">mcp entry in the same log:</text><text x="997" y="454">who called which MCP</text>
  <text x="997" y="525">blocks exit on eslint or</text><text x="997" y="539">ui5lint errors, files with</text><text x="997" y="553">no edit entry (Edit/Write</text><text x="997" y="567">bypassed) and no MCP call per</text><text x="997" y="581">MCP_RULES: exit 2 lists</text><text x="997" y="595">complaints, the agent fixes</text>
  <text x="987" y="746">STATE valid, registry fresh,</text><text x="987" y="760">CHANGELOG updated, npm test green</text>
  <text x="32" y="809">Whenever the chat memory overflows and Claude Code compacts the history: PreCompact event, script pre-compact.mjs appends a line "date, branch, number of changed</text><text x="32" y="825">files" to the session log .pipeline/sessions.log. All seven checks, with event and script names, are described below under "Automatic checks".</text>
</g>
</svg>
