# User-facing texts of the pipeline scripts (session briefing, backlog queue). Loaded by
# scripts/lib/backlog.mjs for PIPELINE_LANG; pipeline_<lang>.properties overlays this file.
# Placeholders {0}, {1} ... are substituted in order.
briefing.title=Briefing
briefing.language=Language: {0} (PIPELINE_LANG in .claude/settings.local.json, env)
briefing.now.idle=Now: no feature in work, branch {0}, {1}, last commit {2}.
briefing.now.feature=Now: feature {0}, phase {1}, branch {2}, {3}, last commit {4}.
briefing.tree.clean=tree clean
briefing.tree.dirty={0} uncommitted file(s)
briefing.queue=Queue: {0}
briefing.queue.empty=Queue: empty, add an item with /backlog <description>.
briefing.blocked=after #{0}
briefing.inprogress=in work
briefing.specready=plan ready
briefing.recommend.spec=Recommended now: /spec #{0} ({1}, unblocked, no plan yet).
briefing.recommend.feature=Recommended now: /feature #{0} ({1}, plan approved).
briefing.recommend.continue=Recommended now: continue #{0} {1} (in work, /feature #{0}).
briefing.recommend.none=Recommended now: nothing unblocked; add or unblock an issue with /backlog.
briefing.debt=Open debt: {0} item(s), docs/STATE.md.
briefing.github.cached=GitHub unreachable; queue from the cache of {0}.
briefing.github.down=GitHub unreachable and no cache; check gh auth status, then node scripts/backlog.mjs list.
queue.title=Backlog queue ({0} open)
queue.row=#{0} {1} [{2}] {3}
queue.empty=No open feature issues. Add one with /backlog <description>.
