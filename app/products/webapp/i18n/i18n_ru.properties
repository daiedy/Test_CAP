# This is the resource bundle for products

#XTIT: Application name
appTitle=Каталог товаров

#YDES: Application description
appDescription=Приложение каталога товаров

#XTIT: Title of the Details custom section on the product Object Page (manifest)
ProductsObjectPage.details.title=Характеристики

#XFLD: Counter of filled detail fields; {0} filled fields, {1} all fields of the subcategory
ProductsObjectPage.details.filled=Заполнено {0} из {1}

#XMSG: Details section in display mode when the product has no subcategory
ProductsObjectPage.details.noSubcategory=Подкатегория не выбрана.

#XMSG: Details section in edit mode when the product has no subcategory
ProductsObjectPage.details.selectSubcategory=Выберите подкатегорию, чтобы заполнить характеристики.

#XMSG: Details section when the subcategory has no assigned attributes
ProductsObjectPage.details.noAttributes=Нет характеристик.

#XMSG: Value state text of a list field whose typed text matches no item
ProductsObjectPage.details.valueNotInList=Выберите значение из списка.
