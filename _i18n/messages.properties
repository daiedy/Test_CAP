# Error messages for req.reject(code, 'KEY', [args]). Keys UPPER_SNAKE, prefixed with entity.
# Import of products from an xlsx workbook (ADR-0021). {0} row numbers count the header row as 1.
#XMSG: Success of the import, {0} number of created products
PRODUCTS_IMPORT_DONE=Products imported: {0}.
#XMSG: First message of every rejected import, nothing was written
PRODUCTS_IMPORT_NOTHING_IMPORTED=No products were imported. Correct the rows listed below and import the file again.
#XMSG: Row error, {0} sheet row, {1} workbook column name, {2} localized reason of the framework check
PRODUCTS_IMPORT_ROW_INVALID=Row {0}, column "{1}": {2}
#XMSG: Row error, {0} sheet row, {1} product name that already exists
PRODUCTS_IMPORT_DUPLICATE_NAME=Row {0}, column "name": a product named "{1}" already exists in the catalog or earlier in the file.
#XMSG: The uploaded file is not an xlsx workbook
PRODUCTS_IMPORT_NOT_XLSX=The file is not an Excel workbook. Choose an .xlsx file.
#XMSG: The workbook has no data rows below the header row
PRODUCTS_IMPORT_EMPTY=The file contains no product rows. Add rows below the header row.
#XMSG: Header error, {0} header text of the unsupported column
PRODUCTS_IMPORT_UNKNOWN_COLUMN=Column "{0}" is not supported. Allowed columns: name, description, price, currency, stock, category, subcategory, rating, imageUrl.
#XMSG: Header error, {0} name of the documented column that appears more than once
PRODUCTS_IMPORT_DUPLICATE_COLUMN=The header row names column "{0}" more than once.
#XMSG: Header error, {0} name of the missing mandatory column
PRODUCTS_IMPORT_MISSING_COLUMN=The header row has no column "{0}".
#XMSG: Row limit exceeded, {0} data rows in the file, {1} maximum rows per import
PRODUCTS_IMPORT_TOO_MANY_ROWS=The file has {0} product rows; at most {1} can be imported at once. Split the file.
#XMSG: The unpacked workbook is too large, {0} limit of the unpacked workbook in MB
PRODUCTS_IMPORT_TOO_LARGE=The file contains more than {0} MB of data and cannot be imported at once. Keep only the product sheet and split the file.
#XMSG: The subcategory of a product belongs to another category (@assert constraint, ADR-0024 decision 2)
PRODUCTS_SUBCATEGORY_MISMATCH=The subcategory does not belong to the category of the product.
#XMSG: The attribute of a detail row is not assigned to the product's subcategory (@assert constraint, ADR-0026 decision 5)
PRODUCTS_DETAIL_ATTRIBUTE_NOT_ASSIGNED=The attribute is not available for the subcategory of the product.
#XMSG: A second detail row for an attribute the product already has (@assert constraint, ADR-0026 decision 5)
PRODUCTS_DETAIL_ATTRIBUTE_DUPLICATE=The product already has a row for this attribute.
#XMSG: The new subcategory leaves detail rows with unassigned attributes (@assert constraint, ADR-0026 decision 6)
PRODUCTS_SUBCATEGORY_HAS_FOREIGN_DETAILS=Some detail rows do not fit the new subcategory. Delete or change them before saving.
# Typed detail values (@assert constraints, ADR-0027 decision 4): a constraint passes no arguments, so no placeholders.
#XMSG: A value in the column of another value type (text on a number attribute, a list value on a multiple-choice attribute)
PRODUCTS_DETAIL_VALUE_TYPE_MISMATCH=The value does not match the type of this detail.
#XMSG: A number below the minimum or above the maximum of the attribute
PRODUCTS_DETAIL_VALUE_OUT_OF_RANGE=Enter a value within the allowed range.
#XMSG: A fraction on a whole-number attribute (PLAN D12)
PRODUCTS_DETAIL_VALUE_NOT_INTEGER=Enter a whole number.
#XMSG: A list value that belongs to the list of another attribute
PRODUCTS_DETAIL_VALUE_NOT_IN_LIST=Select a value from the list.
#XMSG: The same value selected twice on one multiple-choice detail row
PRODUCTS_DETAIL_SELECTION_DUPLICATE=This value is already selected.
#XMSG: Warning of a draft subcategory change (ADR-0027 decision 3), {0} number of removed filled values, {1} comma-separated localized attribute names
PRODUCTS_DETAILS_VALUES_REMOVED=Values removed: {0}. These details do not apply to the new subcategory: {1}.
# Validations of feature products-validations (ADR-0028). The import reuses these texts as the reason of PRODUCTS_IMPORT_ROW_INVALID.
#XMSG: Name shorter than 3 characters after trimming (@assert.format.message, ADR-0028 decision 1)
PRODUCTS_NAME_TOO_SHORT=Enter a product name with at least 3 characters.
#XMSG: A product with the same name exists, case and padding ignored (@assert constraint over namesakes, ADR-0028 decision 2)
PRODUCTS_NAME_DUPLICATE=A product with this name already exists. Enter a different name.
#XMSG: Price of 0 or below (@assert.range.message, closed bound 0.01 = the smallest two-decimal amount, ADR-0028 decision 1); on the Object Page the client type shows the framework text first
PRODUCTS_PRICE_POSITIVE=Enter a price greater than 0.
#XMSG: Decimals in a currency without minor units; shown on price and currency (@assert constraint with two targets, ADR-0028 decision 3)
PRODUCTS_PRICE_MINOR_UNIT=Enter the price as a whole number. This currency has no decimal places.
#XMSG: Image URL that is not https or contains whitespace (@assert.format.message, ADR-0028 decision 1)
PRODUCTS_IMAGE_URL_HTTPS=Enter an address that starts with https:// and has no spaces.
#XMSG: Empty description while the stock is above 0; shown on description and stock (@assert constraint with two targets, ADR-0028 decision 4)
PRODUCTS_DESCRIPTION_REQUIRED_IN_STOCK=Enter a description. Products in stock are visible to customers.
#XMSG: Empty value of a detail the subcategory requires (@assert constraint on the row, ADR-0028 decision 5); no placeholder, a constraint passes no arguments
PRODUCTS_DETAIL_VALUE_REQUIRED=Fill in this detail. It is required for products of this subcategory.
#XMSG: Numeric detail outside the bounds of the subcategory assignment (@assert branch, ADR-0028 decision 8)
PRODUCTS_DETAIL_VALUE_OUT_OF_SUBCATEGORY_RANGE=Enter a value within the range allowed for this subcategory.
#XMSG: Detail value below the value of the attribute named by atLeast in the same product (@assert branch with error() arguments, ADR-0028 decisions 3 and 9); {0} the row's attribute name, {1} the name of atLeast, both localized
PRODUCTS_DETAIL_VALUE_BELOW_OTHER={0} must not be below {1}.
#XMSG: Memory value that is not a power of two (@assert branch, literal attribute code, showcase)
PRODUCTS_DETAIL_VALUE_NOT_POWER_OF_TWO=Enter a power of two, for example 8, 16 or 32.
#XMSG: Guard, not user-facing: value of a dependent detail while no enabling list value is selected in the product (@assert branch, ADR-0028 decision 10); the form disables and clears the row instead
PRODUCTS_DETAIL_VALUE_NOT_ENABLED=This detail applies only when a wireless connectivity is selected.
